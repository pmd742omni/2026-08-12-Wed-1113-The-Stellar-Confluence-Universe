        :root {
            --bg-color: #0b0f19;

            --accent-gold: #f39c12;
            --accent-solar: #e67e22;
            --accent-void: #9b59b6;

            --accent-frost: #1abc9c;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #2d3748;

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at center, #1a233a 0%, #0b0f19 100%);
        }
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background-color: var(--accent-gold);
            color: #000;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .radar-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .audio-bar {
            padding: 16px 24px;
            background: rgba(21, 28, 46, 0.9);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-gold { background: var(--accent-solar); }
        .btn-void { background: var(--accent-void); }
        .btn-gear { background: var(--accent-gear); }
        .star-node { cursor: pointer; transition: transform 0.2s; }
        .star-node:hover { transform: scale(2); }
    </style>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.2);
        }
        document.querySelectorAll('.star-node').forEach(el => {
            el.addEventListener('click', () => {
                document.getElementById('insp-hero').innerText = el.dataset.hero;
                document.getElementById('insp-fac').innerText = el.dataset.faction;
                document.getElementById('insp-world').innerText = 'Homeworld: ' + el.dataset.world + ' (Book ' + el.dataset.book + ')';
            });
        });
